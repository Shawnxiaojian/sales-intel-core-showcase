name: 展示仓库质量检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装展示包
        run: python -m pip install .
      - name: 运行测试
        run: python -m unittest discover -s tests -v
