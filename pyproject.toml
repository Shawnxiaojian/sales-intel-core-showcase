[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-intel-core-showcase"
version = "2.0.1"
description = "脱敏的销售情报自动化架构展示"
requires-python = ">=3.9"
authors = [{name = "Shawn Xiao"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
